name: HydrationLogger
options:
  bundleIdPrefix: com.hydration
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  HydrationLogger:
    type: application
    platform: iOS
    sources:
      - path: HydrationLogger
    info:
      path: HydrationLogger/Info.plist
      properties:
        CFBundleDisplayName: Hydration Logger
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Arka planda BLE notify almaya devam etmek icin
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: >-
          ESP32 sensör cihazına bağlanıp gelen ölçüm verilerini kaydetmek için
          Bluetooth erişimi gerekiyor.
        # Kaydedilen CSV dosyalari Files uygulamasindan / iTunes'dan gorunsun
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hydration.logger
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
